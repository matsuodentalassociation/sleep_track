<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>音声記録確認</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif; margin: 0;
      background: #f3f5f8; color: #182231;
    }
    main { max-width: 640px; margin: auto; padding: 24px 18px; }
    h1 { font-size: 23px; margin-bottom: 8px; }
    p { line-height: 1.7; }
    .card {
      background: white; border-radius: 16px; padding: 20px;
      margin: 16px 0; border: 1px solid #e0e5ec;
    }
    button, .download {
      padding: 13px 20px; border-radius: 10px; border: none;
      font-size: 16px; cursor: pointer;
    }
    button { background: #235bce; color: white; }
    button:disabled { opacity: .5; cursor: default; }
    #stop { background: #bc3544; }
    .buttons { display: flex; gap: 12px; margin: 16px 0; }
    #status { font-weight: bold; min-height: 26px; }
    .meter { height: 14px; background: #e8edf5; border-radius: 8px; overflow: hidden; }
    #level { height: 100%; width: 0; background: #329767; }
    input[type=range] { width: 100%; margin: 18px 0 8px; }
    label { display: block; margin-top: 18px; }
    .small { font-size: 13px; color: #5b6575; }
    .clip { border-top: 1px solid #e0e5ec; padding: 16px 0; }
    .clip:first-child { border-top: 0; }
    audio { width: 100%; margin: 12px 0; }
    .download {
      display: inline-block; background: #edf2fc; color: #235bce;
      text-decoration: none; font-size: 14px; padding: 9px 12px;
      margin-right: 8px; margin-top: 6px;
    }
    #error { color: #a52a36; white-space: pre-wrap; }
  </style>
</head>
<body>
<main>
  <h1>音声・発生時刻 記録確認</h1>
  <p>音がした区間を録音し、開始時刻と録音時間を表示します。</p>

  <section class="card">
    <div id="status" role="status">停止中</div>
    <div class="buttons">
      <button id="start">開始</button>
      <button id="stop" disabled>停止</button>
    </div>
    <div class="meter"><div id="level"></div></div>
    <label for="threshold">録音を始める音量：<span id="thresholdValue">0.025</span></label>
    <input id="threshold" type="range" min="0.005" max="0.100" step="0.005" value="0.025">
    <div class="small">小さくすると、小さい音でも録音します。音が収まって約0.6秒後に録音を終了します。</div>
    <p id="error" role="alert"></p>
  </section>

  <section class="card">
    <h2 style="font-size:18px">保存された録音 <span id="count">0</span>件</h2>
    <div id="empty" class="small">開始して、声などの音を出してください。</div>
    <div id="clips"></div>
  </section>

  <p class="small">
    確認中は画面を開いたままにしてください。録音はサーバーへ送信しません。
    この画面を閉じると録音は消えるため、残したい音声は「音声を保存」で保存してください。
    時刻は録音開始操作の時刻で、厳密な音声サンプル時刻ではありません。
  </p>
</main>

<script>
  const $ = id => document.getElementById(id);
  let stream, context, analyser, samples, recorder;
  let active = false, timer = null, count = 0;
  let quietSince = null;
  let wakeLock = null;

  $('threshold').oninput = () => {
    $('thresholdValue').textContent = Number($('threshold').value).toFixed(3);
  };

  function addDownload(parent, blob, name, text) {
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = name;
    link.className = 'download';
    link.textContent = text;
    parent.appendChild(link);
  }

  function beginClip() {
    const formats = [
      'audio/webm;codecs=opus', 'audio/mp4', 'audio/webm'
    ];
    const mime = formats.find(type => MediaRecorder.isTypeSupported(type));
    const current = mime
      ? new MediaRecorder(stream, { mimeType: mime })
      : new MediaRecorder(stream);
    const chunks = [];
    const startDate = new Date();
    const startClock = performance.now();
    let endClock = startClock;

    current.ondataavailable = event => {
      if (event.data.size) chunks.push(event.data);
    };

    current.onstop = () => {
      if (recorder === current) recorder = null;
      quietSince = null;
      if (active) $('status').textContent = '音声監視中';

      if (!chunks.length) return;
      const type = current.mimeType || chunks[0].type;
      const blob = new Blob(chunks, { type });
      const extension = type.includes('mp4') ? 'm4a'
        : type.includes('ogg') ? 'ogg' : 'webm';
      const duration = Math.max(0, (endClock - startClock) / 1000);
      const name = 'audio_' + startDate.getTime();
      const section = document.createElement('div');
      section.className = 'clip';

      const heading = document.createElement('strong');
      heading.textContent = startDate.toLocaleString('ja-JP', { hour12: false })
        + '.' + String(startDate.getMilliseconds()).padStart(3, '0');
      section.appendChild(heading);

      const detail = document.createElement('div');
      detail.className = 'small';
      detail.textContent = '録音時間：' + duration.toFixed(2) + '秒';
      section.appendChild(detail);

      const audio = document.createElement('audio');
      audio.controls = true;
      audio.src = URL.createObjectURL(blob);
      section.appendChild(audio);

      const metadata = {
        start_epoch_ms: startDate.getTime(),
        start_iso: startDate.toISOString(),
        duration_seconds: duration,
        duration_basis: 'browser_monotonic_clock',
        timestamp_basis: 'recorder_start_request',
        audio: name + '.' + extension,
        mime_type: type
      };
      addDownload(section, blob, metadata.audio, '音声を保存');
      addDownload(section,
        new Blob([JSON.stringify(metadata, null, 2)],
          { type: 'application/json' }),
        name + '.json', '時刻情報を保存');

      $('clips').prepend(section);
      $('empty').hidden = true;
      $('count').textContent = ++count;
    };

    current.onerror = () => {
      $('error').textContent = '録音エラーが発生しました。停止して再度お試しください。';
      endMonitoring();
    };

    current.finish = () => {
      if (current.state === 'recording') {
        endClock = performance.now();
        current.stop();
      }
    };

    current.start();
    recorder = current;
    quietSince = null;
    $('status').textContent = '録音中';
  }

  function inspect() {
    if (!active) return;
    try {
      analyser.getFloatTimeDomainData(samples);
      let sum = 0;
      for (const sample of samples) sum += sample * sample;
      const rms = Math.sqrt(sum / samples.length);
      $('level').style.width = Math.min(100, rms * 1000) + '%';
      const loud = rms >= Number($('threshold').value);
      const now = performance.now();

      if (loud) {
        quietSince = null;
        if (!recorder) beginClip();
      } else if (recorder && recorder.state === 'recording') {
        if (quietSince === null) quietSince = now;
        if (now - quietSince >= 600) recorder.finish();
      }
    } catch (error) {
      $('error').textContent = '音声取得エラー：' + error.message;
      endMonitoring();
    }
  }

  async function endMonitoring() {
    if (!active) return;
    active = false;
    clearInterval(timer);
    $('stop').disabled = true;
    $('status').textContent = '保存中';

    const current = recorder;
    if (current) {
      await new Promise(resolve => {
        current.addEventListener('stop', resolve, { once: true });
        if (current.state === 'recording') current.finish();
      });
    }
    stream?.getTracks().forEach(track => track.stop());
    await context?.close().catch(() => {});
    if (wakeLock) await wakeLock.release().catch(() => {});
    wakeLock = null;
    $('level').style.width = '0';
    $('status').textContent = '停止中';
    $('start').disabled = false;
  }

  $('start').onclick = async () => {
    $('error').textContent = '';
    $('start').disabled = true;
    $('status').textContent = 'マイクを準備中';
    try {
      if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
        throw new Error('この表示環境ではマイク録音を利用できません。HTTPSのページをSafariまたはChromeで開く必要があります。');
      }
      stream = await navigator.mediaDevices.getUserMedia({ audio: {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false
      } });
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      context = new AudioContextClass();
      await context.resume();
      analyser = context.createAnalyser();
      analyser.fftSize = 2048;
      samples = new Float32Array(analyser.fftSize);
      context.createMediaStreamSource(stream).connect(analyser);
      active = true;
      $('stop').disabled = false;
      $('status').textContent = '音声監視中';
      timer = setInterval(inspect, 40);
      if (navigator.wakeLock) {
        navigator.wakeLock.request('screen').then(lock => {
          if (active) wakeLock = lock;
          else lock.release().catch(() => {});
        }).catch(() => {});
      }
    } catch (error) {
      stream?.getTracks().forEach(track => track.stop());
      await context?.close().catch(() => {});
      $('status').textContent = '開始できませんでした';
      $('error').textContent = error.message;
      $('start').disabled = false;
    }
  };

  $('stop').onclick = endMonitoring;
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && active) endMonitoring();
  });
</script>
</body>
</html>
