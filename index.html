<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SomnoLog v07生成</title>
<style>
body{margin:0;background:#101419;color:#f0eee6;font-family:system-ui,sans-serif}
main{max-width:780px;margin:auto;padding:24px}
section{background:#192029;padding:20px;border:1px solid #354350;border-radius:16px}
p,pre{line-height:1.8}pre{white-space:pre-wrap;overflow-wrap:anywhere}
input{display:block;margin:16px 0;width:100%}
button{padding:16px;border:0;border-radius:12px;background:#84b9cf;font:inherit;font-weight:bold}
button:disabled{opacity:.4}
a{display:block;padding:20px 0;color:#9bd5ff}
</style>
</head>
<body>
<main>
<h1>SomnoLog v07生成</h1>
<p>今回添付したv06本体を選択してください。音・体動の集計、短時間のログ保存、取得状態の表示を修正します。元ファイル・既存DBは削除しません。</p>
<section>
<label for="source">SomnoLog_v20261009-06.html</label>
<input id="source" type="file" accept=".html,text/html">
<button id="build" disabled>v07を生成</button>
<div id="download"></div>
<pre id="report" role="status">v06を選択してください。</pre>
</section>
<p>音の判定：録音開始後2秒以内の有効な音量観測の中央値＋10 dB。体動の判定：端末の動的加速度0.05 g以上。医療的な判定ではありません。欠測を「検出なし」に置き換えません。</p>
</main>
<script>
(() => {
  "use strict";
  const $ = id => document.getElementById(id);
  let url = null;
  const logging = String.raw`
let v07PreviousOffset = 0;

function captureLevelObservation() {
  if (!recording || stopping || !activeSession) return;
  const offset = elapsedNow();
  const gap = Math.max(0, offset - v07PreviousOffset);
  const represented = Math.min(150, gap);
  const row = {
    timestamp: Date.now(), offsetMs: offset, gapMs: gap,
    intervalStartMs: Math.max(v07PreviousOffset, offset - represented),
    intervalEndMs: offset,
    representedMs: represented,
    gainLinear: recordingGainPolicy().gainLinear,
    status: "missing",
    audioStatus: "missing", motionStatus: "missing",
    inputRms: null, inputPeak: null, inputDbFS: null,
    outputRms: null, outputPeak: null, outputDbFS: null,
    outputOverFullScaleFraction: null, motionG: null,
    soundDetected: null, motionDetected: null
  };
  v07PreviousOffset = offset;
  if (motionInputAvailable()) {
    row.motionG = motionValueG;
    row.motionStatus = "observed";
    row.motionDetected = motionValueG >= 0.05;
  }
  try {
    if (microphoneInputAvailable() && verifyGraph) {
      const before = levelStats(meterAnalyser, meterSamples);
      const after = levelStats(verifyGraph.analyser, verifyGraph.samples);
      Object.assign(row, {
        audioStatus: "observed",
        inputRms: before.rms, inputPeak: before.peak,
        inputDbFS: before.dbfs,
        outputRms: after.rms, outputPeak: after.peak,
        outputDbFS: after.dbfs,
        outputOverFullScaleFraction: after.over
      });
    }
  } catch (_) { row.audioStatus = "analysis_error"; }
  row.status = gap > 250 ? "gap" :
    row.audioStatus === "observed" && row.motionStatus === "observed"
    ? "observed" : "partial_or_missing";
  verifyRows.push(row);
  if (verifyRows.length >= 10) flushLevelRows();
}

function startLevelLogging() {
  clearInterval(verifyTimer);
  verifyRows = [];
  verifyBatch = 0;
  verifyPreviousMono = null;
  v07PreviousOffset = 0;
  captureLevelObservation();
  verifyTimer = setInterval(captureLevelObservation, 100);
}

function stopLevelLogging() {
  if (verifyTimer !== null) captureLevelObservation();
  clearInterval(verifyTimer);
  verifyTimer = null;
  flushLevelRows();
}
  `;

  const aggregation = String.raw`
function levelRowsFromBatches(batches) {
  return batches.filter(b =>
    b.kind === "audio_levels_v06" || b.kind === "audio_levels_v07")
    .flatMap(b => Array.isArray(b.rows) ? b.rows : [])
    .sort((a, b) => a.offsetMs - b.offsetMs);
}

function aggregateObservedLevels(rows, durationMs) {
  const audioValid = r => r.audioStatus === "observed" ||
    (r.audioStatus === undefined && Number.isFinite(r.inputRms));
  const motionValid = r => r.motionStatus === "observed" ||
    (r.motionStatus === undefined && Number.isFinite(r.motionG));
  // デジタル無音はdBFSが有限ではないため基準値の候補にしない。
  const calibration = rows.filter(r => r.offsetMs <= 2000 &&
    audioValid(r) && Number.isFinite(r.inputDbFS))
    .map(r => r.inputDbFS).sort((a, b) => a - b);
  let baseline = null;
  if (calibration.length) {
    const middle = Math.floor(calibration.length / 2);
    baseline = calibration.length % 2 ? calibration[middle] :
      (calibration[middle - 1] + calibration[middle]) / 2;
  }
  let previous = 0, audioObserved = 0, motionObserved = 0;
  let soundClassified = 0, soundDetected = 0, motionDetected = 0;
  for (const r of rows) {
    const end = Math.min(durationMs, Math.max(0, r.offsetMs));
    const start = Number.isFinite(r.intervalStartMs) ?
      Math.max(previous, r.intervalStartMs) :
      Math.max(previous, end - 150);
    const width = Math.max(0, Math.min(150, end - start));
    previous = Math.max(previous, end);
    if (audioValid(r)) {
      audioObserved += width;
      if (baseline !== null) {
        soundClassified += width;
        r.soundDetected = r.inputRms === 0 ? false :
          Number.isFinite(r.inputDbFS) ? r.inputDbFS >= baseline + 10 : null;
        if (r.soundDetected === true) soundDetected += width;
      } else r.soundDetected = null;
    }
    if (motionValid(r)) {
      motionObserved += width;
      r.motionDetected = r.motionG >= 0.05;
      if (r.motionDetected) motionDetected += width;
    }
  }
  const missingAudio = Math.max(0, durationMs - audioObserved);
  const missingMotion = Math.max(0, durationMs - motionObserved);
  return {
    baselineDbFS: baseline, soundThresholdDb: 10, motionThresholdG: 0.05,
    soundDetectedMs: soundClassified > 0 ? soundDetected : null,
    motionDetectedMs: motionObserved > 0 ? motionDetected : null,
    audioObservedMs: audioObserved, motionObservedMs: motionObserved,
    soundClassifiedMs: soundClassified,
    audioMissingMs: missingAudio, motionMissingMs: missingMotion,
    observationCount: rows.length,
    dataStatus: !audioObserved && !motionObserved ? "unobtainable" :
      missingAudio > 0 || missingMotion > 0 || baseline === null
      ? "has_missing" : "observed",
    aggregationMethod: "sampled_intervals_capped_150ms",
    baselineMethod: "median_finite_input_dbfs_first_2000ms",
    detectionMeaning: "approximate_observed_duration_not_continuous_detection"
  };
}

async function finalizeObservedMetrics(session, durationMs) {
  const batches = await sessionItems("profileBins", session.sessionId);
  const rows = levelRowsFromBatches(batches);
  session.metrics = Object.assign({}, session.metrics,
    aggregateObservedLevels(rows, durationMs));
  session.implementationPhase = 3;
}

function v07CoverageText(session) {
  const m = session.metrics || {};
  const seconds = v => Number.isFinite(v) ? (v / 1000).toFixed(2) + "秒" : "未集計";
  return "観測 " + (m.observationCount ?? "未集計") +
    "件／音入力取得 " + seconds(m.audioObservedMs) +
    "／体動入力取得 " + seconds(m.motionObservedMs) +
    "／音欠測 " + seconds(m.audioMissingMs) +
    "／体動欠測 " + seconds(m.motionMissingMs) +
    "。検出時間は観測区間の概算です。" +
    (Number.isFinite(m.baselineDbFS)
      ? " 音基準 " + m.baselineDbFS.toFixed(1) + " dBFS＋10 dB。"
      : " 音基準未取得のため音の検出時間は算出できません。");
}

async function makeLevelsCSV() {
  if (verifyBlocked() || !currentSession) return;
  const session = currentSession;
  verifyBusy = true;
  updateControls();
  try {
    const batches = await sessionItems("profileBins", session.sessionId);
    const rows = levelRowsFromBatches(batches);
    if (!rows.length) throw new Error("保存済み観測ログがありません。");
    const duration = session.recording.totalDurationMs || 0;
    aggregateObservedLevels(rows, duration);
    const keys = ["timestamp", "offsetMs", "gapMs", "intervalStartMs",
      "intervalEndMs", "representedMs", "gainLinear", "status",
      "audioStatus", "motionStatus", "inputRms", "inputPeak", "inputDbFS",
      "outputRms", "outputPeak", "outputDbFS",
      "outputOverFullScaleFraction", "motionG",
      "soundDetected", "motionDetected"];
    const csv = "\ufeff" + keys.join(",") + "\r\n" +
      rows.map(r => keys.map(k => r[k] ?? "").join(",")).join("\r\n");
    if (verifyCSVURL) URL.revokeObjectURL(verifyCSVURL);
    verifyCSVURL = URL.createObjectURL(new Blob([csv],
      { type: "text/csv;charset=utf-8" }));
    const a = document.createElement("a");
    a.href = verifyCSVURL;
    a.download = session.sessionId + "_levels.csv";
    a.textContent = "音・体動CSVを保存（" + rows.length + "観測）";
    a.style.cssText = "display:block;padding:16px 0;color:#9bd5ff";
    verifyPanel.querySelector("[data-csv]").replaceChildren(a);
    verifyMessage("CSVを用意しました。空欄は欠測または未判定です。" +
      " 音声解析窓は別々で、倍率の厳密比較ではありません。");
  } catch (error) { verifyMessage(errorText(error)); }
  finally { verifyBusy = false; updateControls(); }
}
  `;

  function once(text, from, to, label) {
    const p = text.indexOf(from);
    if (p < 0 || text.indexOf(from, p + from.length) >= 0) {
      throw new Error(label + "の位置が一意に一致しません。");
    }
    return text.slice(0, p) + to + text.slice(p + from.length);
  }
  function between(text, from, until, replacement, label) {
    const p = text.indexOf(from);
    const q = text.indexOf(until, p + from.length);
    if (p < 0 || q < 0 || text.indexOf(from, p + from.length) >= 0) {
      throw new Error(label + "の関数範囲が一致しません。");
    }
    return text.slice(0, p) + replacement + "\n\n" + text.slice(q);
  }

  $("source").onchange = () => {
    $("build").disabled = !$("source").files.length;
    $("report").textContent = "選択済み。v07を生成してください。";
  };

  $("build").onclick = async () => {
    $("build").disabled = true;
    $("download").replaceChildren();
    if (url) URL.revokeObjectURL(url);
    url = null;
    let stage = "読込";
    try {
      const original = await $("source").files[0].text();
      const starts = [...original.matchAll(/<script\b[^>]*>/gi)];
      const doc = new DOMParser().parseFromString(original, "text/html");
      if (starts.length !== 1 || doc.querySelectorAll("script").length !== 1 ||
          doc.querySelector("script").hasAttribute("src")) {
        throw new Error("単一インラインscriptのv06本体を選択してください。");
      }
      const start = starts[0].index + starts[0][0].length;
      const end = original.toLowerCase().indexOf("<" + "/script>", start);
      if (end < 0) throw new Error("script終了タグがありません。");
      let code = original.slice(start, end).replace(/\r\n?/g, "\n");
      if (code !== doc.querySelector("script").textContent) {
        throw new Error("script抽出検査に失敗しました。");
      }
      stage = "v06確認";
      if (!code.includes("SOMNOLOG_AUDIO_VERIFY_V06") ||
          code.includes("function aggregateObservedLevels(")) {
        throw new Error("今回のv06本体ではないか、修正済みです。");
      }
      new Function(code);
      stage = "修正";
      code = once(code, 'const APP_VERSION = "v20261009-06";',
        'const APP_VERSION = "v20261009-07";', "バージョン");
      code = between(code, "  function startLevelLogging() {",
        "  function clearVerifyFiles() {", logging, "短時間観測");
      code = between(code, "  async function makeLevelsCSV() {",
        "  async function decodeSavedAudio() {", aggregation, "集計・CSV");
      code = once(code, 'kind: "audio_levels_v06",',
        'kind: "audio_levels_v07",', "ログ識別");
      code = once(code,
        'if (!recording || stopping) return;\nstopping = true;',
        'if (!recording || stopping) return;\nstopLevelLogging();\nstopping = true;',
        "停止直前観測");
      code = once(code,
        'stopLevelLogging();\nawait saveChain;\nsession.state =',
        'stopLevelLogging();\nawait saveChain;\n' +
        'await finalizeObservedMetrics(session, stopOffset);\n' +
        'if (!session.audioChunkCount || !session.audioBytes) {\n' +
        'recordingFault = recordingFault || "最終音声データが0バイトです。音声保存は成功していません。";\n' +
        '}\nsession.state =',
        "停止後集計・0バイト確認");
      code = once(code,
        '+ `音・体動集計はPhase 3未実装。`',
        '+ v07CoverageText(session)', "終了表示");
      code = once(code,
        'phase.textContent = "Phase 3未実装";',
        'phase.textContent = "観測ログ集計";', "履歴見出し");
      code = once(code,
        '"実測波形・音／体動の検出時間は未取得。サンプル値は表示しません。";',
        'v07CoverageText(session) + " 時系列グラフは未実装です。";',
        "履歴取得状態");
      code = once(code,
        'detail: "Phase 2。センシングログは未取得。"',
        'detail: "v07。音・端末体動の観測ログと概算検出時間を保存。"',
        "開始ログ説明");
      code = once(code, 'previewMessage("記録開始 — Phase 2",',
        'previewMessage("記録開始 — v07",', "開始表示");
      code = once(code,
        '"実測メーターは動作します。音・体動の検出時間集計は未実装です。"',
        '"音・端末体動を約100ms周期で観測し、停止時に検出時間を概算します。音基準は開始後2秒の有効観測から求めます。"',
        "集計説明");
      code = code.replaceAll("100ms集計は未実装です。",
        "v07では録音中の観測ログと概算検出時間を保存します。");
      code = code.replaceAll(
        "実測メーターを利用できます。検出時間・保存波形はPhase 3、ZIPはPhase 4です。",
        "実測メーターと観測ログの概算検出時間を利用できます。時系列グラフとZIPは未実装です。");
      code = code.replaceAll(
        "※端末内に保存した実記録を表示します。波形はPhase 3未実装。",
        "※端末内の実記録を表示します。検出時間は観測区間の概算。グラフは未実装。");
      stage = "出力検査";
      new Function(code);
      const result = original.slice(0, start) + code + original.slice(end);
      const check = new DOMParser().parseFromString(result, "text/html");
      if (check.querySelectorAll("script").length !== 1 ||
          check.querySelector("script").textContent !== code) {
        throw new Error("生成後scriptの構造が一致しません。");
      }
      url = URL.createObjectURL(new Blob([result],
        { type: "text/html;charset=utf-8" }));
      const link = document.createElement("a");
      link.href = url;
      link.download = "SomnoLog_v20261009-07.html";
      link.textContent = "SomnoLog_v20261009-07.htmlを保存";
      $("download").append(link);
      $("report").textContent =
        "生成成功：v20261009-07\n" +
        "・音／体動の検出時間・取得時間・欠測時間を保存\n" +
        "・開始時と停止直前にも観測\n" +
        "・約1秒分ごとと停止時にログ保存\n" +
        "・音声0バイトをエラーとして表示\n" +
        "・既存DB・ゲイン・録音経路・更新機能を維持\n\n" +
        "構文とscript構造を検査しました。実機動作は未検証です。\n" +
        "公開先のindex.htmlを置き換え、起動表示07を確認してください。\n" +
        "旧記録の集計は自動更新しません。新しい短時間録音で確認してください。";
    } catch (e) {
      $("report").textContent = "生成中止：" + stage + "\n" +
        e.name + "：" + e.message + "\n元HTMLは変更していません。";
    } finally {
      $("build").disabled = !$("source").files.length;
    }
  };
})();
</script>
</body>
</html>
